<!doctype html>
<html lang="zh-Hans">
	<head>
		<title></title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			@media (prefers-color-scheme: dark) {
				body {
					color: white;
				}
			}
		</style>
	</head>
	<body>
		<p id="projectBrowserTip" style="font-size: 11px"></p>
		<p id="importTip" style="font-size: 11px"></p>
		<span id="teamLabel" style="font-size: 14px"></span>
		<select id="teamSelect" style="max-width: 140px">
			<option value="">---</option>
		</select>
		<br />
		<br />
		<input id="exportButton" value="" type="button" />
		<script type="text/javascript">
			var edaObj = typeof eda !== 'undefined' ? eda : window.parent && window.parent.eda;
			function t(tag, ...args) {
				if (edaObj && edaObj.sys_I18n) return edaObj.sys_I18n.text(tag, undefined, undefined, ...args);
				return tag;
			}

			function applyI18n() {
				var els = document.querySelectorAll('[data-i18n]');
				for (var i = 0; i < els.length; i++) {
					els[i].textContent = t(els[i].getAttribute('data-i18n'));
				}
				var phEls = document.querySelectorAll('[data-i18n-placeholder]');
				for (var j = 0; j < phEls.length; j++) {
					phEls[j].placeholder = t(phEls[j].getAttribute('data-i18n-placeholder'));
				}
				var titleEls = document.querySelectorAll('[data-i18n-title]');
				for (var k = 0; k < titleEls.length; k++) {
					titleEls[k].title = t(titleEls[k].getAttribute('data-i18n-title'));
				}
			}

			// 「当前工程」选项的占位值，避免与团队 UUID 冲突
			var CURRENT_PROJECT_VALUE = '__current_project__';

			document.title = t('Export Project Archive');
			document.getElementById('projectBrowserTip').textContent = t(
				'If using in browser, allow automatic downloads after download starts. Batch download from workspace is recommended for faster speed.',
			);
			document.getElementById('importTip').textContent = t('Exported files can be imported via Editor > File > Import > EasyEDA Pro.');
			document.getElementById('teamLabel').textContent = t('Please select a team or project:');
			document.getElementById('exportButton').value = t('Export');

			// 下拉列表构成：--- / 当前工程（若已打开工程）/ 全部团队
			document.addEventListener('DOMContentLoaded', async function () {
				var sel = document.getElementById('teamSelect');
				sel.disabled = true;
				try {
					var pinfo = await eda.dmt_Project.getCurrentProjectInfo();
					if (pinfo && pinfo.uuid) {
						var opt = document.createElement('option');
						opt.value = CURRENT_PROJECT_VALUE;
						var label = pinfo.friendlyName || pinfo.name || '';
						opt.textContent = t('Current Project') + (label ? ' (' + label + ')' : '');
						sel.appendChild(opt);
					}
				} catch (e) {
					console.error('获取当前工程失败:', e);
				}
				try {
					var teams = await eda.dmt_Team.getAllTeamsInfo();
					for (var i = 0; i < teams.length; i++) {
						var teamOption = document.createElement('option');
						teamOption.innerHTML = teams[i].name;
						teamOption.value = teams[i].uuid;
						sel.appendChild(teamOption);
					}
				} catch (e) {
					console.error('获取团队列表失败:', e);
				} finally {
					sel.disabled = false;
				}
			});

			document.getElementById('exportButton').onclick = async function () {
				const selected = document.getElementById('teamSelect').value;
				if (!selected) {
					return;
				}
				// 获取编辑器版本并确定文件格式
				const editorVersion = await eda.sys_Environment.getEditorCurrentVersion();
				console.log('Editor version:', editorVersion);
				// 版本比较：3.0.0.0以上使用epro2，否则使用epro
				const versionParts = editorVersion.split('.').map(Number);
				const isVersion3OrAbove = versionParts[0] >= 3;
				const fileFormat = isVersion3OrAbove ? '.epro2' : '.epro';

				let projectUuids;
				if (selected === CURRENT_PROJECT_VALUE) {
					// 只导出当前正在编辑的工程
					const pinfo = await eda.dmt_Project.getCurrentProjectInfo();
					if (!pinfo || !pinfo.uuid) {
						eda.sys_Message.showToastMessage(t('No project is currently open'));
						return;
					}
					projectUuids = [pinfo.uuid];
				} else {
					projectUuids = await eda.dmt_Project.getAllProjectsUuid(selected);
				}

				// 当前没有办法使用 request 请求权限，只能让用户手动赋予权限，或在批量下载的时候触发浏览器的权限弹窗
				// 如果该网域的【下载多个文件】的权限之前已被设置为 deny，那么无论如何也无法通过编程的方式唤起浏览器权限弹窗
				// https://developer.mozilla.org/en-US/docs/Web/API/Permissions_API/Using_the_Permissions_API#conclusion_and_future_work
				for (const projectUuid of projectUuids) {
					await eda.sys_FileSystem.saveFile(
						await eda.sys_FileManager.getProjectFileByProjectUuid(projectUuid, undefined, undefined, fileFormat),
					);
				}
			};
		</script>
	</body>
</html>
