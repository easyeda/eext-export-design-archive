<!doctype html>
<html lang="zh-Hans">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>导出器件清单</title>
		<script src="/iframe/js/xlsx.full.min.js"></script>
		<script src="/iframe/js/device-list-source.js"></script>
		<script src="/iframe/js/device-list-model.js"></script>
		<style>
			:root {
				color-scheme: light;
				--common-bg-color: #fff;
				--common-font-color: #333;
				--common-border-color: #e9e9e9;
				--border: #d9d9d9;
				--brand: #1890ff;
				--muted: #868686;
				--bg-color-hover-drop-down-menuItem: #e6f7ff;
				--font-color-hover-drop-down-menuItem: #1890ff;
				--bg-color-table-header: #ebebeb;
				--bg-color-1-table-row: #f5f5f5;
				--error: #e55649;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body,
			input,
			button {
				font:
					12px 'Microsoft YaHei',
					Arial,
					sans-serif;
			}
			body {
				color: var(--common-font-color);
				background: var(--common-bg-color);
			}
			body {
				display: flex;
				flex-direction: column;
			}
			button {
				min-width: 96px;
				height: 28px;
				padding: 0 10px;
				border: 1px solid var(--border);
				border-radius: 2px;
				background: var(--common-bg-color);
				color: inherit;
				cursor: pointer;
			}
			button:hover:not(:disabled) {
				border-color: var(--brand);
				color: var(--brand);
			}
			button.primary {
				background: var(--brand);
				border-color: var(--brand);
				color: #fff;
			}
			button.primary:hover:not(:disabled) {
				background: #40a9ff;
				color: #fff;
			}
			button:disabled {
				color: var(--muted);
				background: #f1f1f1;
				cursor: not-allowed;
			}
			button:focus-visible,
			input:focus-visible {
				outline: 2px solid var(--brand);
				outline-offset: 1px;
			}
			input[type='text'] {
				height: 24px;
				border: 1px solid var(--border);
				border-radius: 2px;
				padding: 0 8px;
				min-width: 120px;
				color: inherit;
			}
			input[type='checkbox'] {
				width: 14px;
				height: 14px;
				accent-color: var(--brand);
				vertical-align: middle;
			}
			label {
				display: inline-flex;
				gap: 4px;
				align-items: center;
			}
			p {
				margin: 0;
				line-height: 20px;
			}
			.toolbar,
			.filter-tools,
			.selection-tools,
			.pager {
				display: flex;
				align-items: center;
				gap: 8px;
				flex-wrap: wrap;
			}
			.toolbar {
				padding: 12px 16px;
				border-bottom: 1px solid var(--common-border-color);
			}
			.filters {
				padding: 12px 16px 8px;
				flex-shrink: 0;
			}
			.filter-tools {
				margin-bottom: 8px;
			}
			#rules {
				max-height: 120px;
				overflow: auto;
			}
			.rule {
				display: flex;
				gap: 8px;
				align-items: center;
				margin-bottom: 8px;
			}
			.rule > input {
				flex: 1;
			}
			.rule button.remove {
				min-width: 56px;
			}
			.dropdown {
				position: relative;
				min-width: 150px;
			}
			.dropdown-trigger {
				width: 100%;
				height: 24px;
				text-align: left;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				padding-right: 20px;
			}
			.dropdown-trigger::after {
				content: '';
				position: absolute;
				right: 8px;
				top: 10px;
				border: 4px solid transparent;
				border-top-color: var(--muted);
			}
			.dropdown-options {
				position: fixed;
				z-index: 100;
				overflow: auto;
				max-height: 220px;
				min-width: 150px;
				background: var(--common-bg-color);
				border: 1px solid var(--border);
				box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
			}
			.dropdown-options[hidden] {
				display: none;
			}
			.dropdown-options button {
				display: block;
				border: 0;
				border-radius: 0;
				width: 100%;
				text-align: left;
				height: 24px;
				white-space: nowrap;
			}
			.dropdown-options button:hover,
			.dropdown-options button:focus {
				background: var(--bg-color-hover-drop-down-menuItem);
				color: var(--font-color-hover-drop-down-menuItem);
			}
			#library {
				width: 280px;
			}
			.hint {
				color: var(--muted);
			}
			#filterError {
				color: var(--error);
				min-height: 20px;
			}
			.selection-tools {
				padding: 0 16px 8px;
			}
			.table-wrap {
				margin: 0 16px;
				flex: 1;
				min-height: 100px;
				overflow: auto;
				border-top: 1px solid var(--common-border-color);
				border-bottom: 1px solid var(--common-border-color);
			}
			table {
				border-collapse: separate;
				border-spacing: 0;
				min-width: 100%;
				white-space: nowrap;
			}
			th,
			td {
				padding: 4px 8px;
				height: 28px;
				max-width: 320px;
				overflow: hidden;
				text-overflow: ellipsis;
				border-bottom: 1px solid var(--common-border-color);
				text-align: left;
			}
			th {
				position: sticky;
				top: 0;
				z-index: 2;
				background: var(--bg-color-table-header);
				font-weight: normal;
			}
			th:first-child,
			td:first-child {
				position: sticky;
				left: 0;
				z-index: 1;
				background: var(--common-bg-color);
			}
			th:first-child {
				z-index: 3;
				background: var(--bg-color-table-header);
			}
			th button {
				min-width: 0;
				height: 24px;
				padding: 0;
				border: 0;
				background: transparent;
			}
			tr:nth-child(even) td {
				background: var(--bg-color-1-table-row);
			}
			tr.selected td {
				background: var(--bg-color-hover-drop-down-menuItem);
			}
			.empty {
				text-align: center;
				padding: 24px;
				color: var(--muted);
			}
			.pager {
				padding: 8px 16px;
				justify-content: flex-end;
			}
			#summary {
				margin-right: auto;
			}
			footer {
				flex-shrink: 0;
				padding: 12px 16px;
				border-top: 1px solid var(--common-border-color);
			}
			.footer-row {
				display: flex;
				gap: 8px;
				align-items: center;
				justify-content: flex-end;
			}
			#messageBar {
				flex: 1;
				overflow-wrap: anywhere;
			}
			progress {
				width: 100%;
				height: 5px;
				display: block;
				margin-bottom: 8px;
				accent-color: var(--brand);
			}
			progress[hidden] {
				display: none;
			}
		</style>
	</head>
	<body>
		<div class="toolbar">
			<span data-i18n="Export library:">导出库：</span>
			<div id="library"></div>
			<button id="load" class="primary" data-i18n="读取" disabled>读取</button
			><span class="hint" data-i18n="先建表，再筛选并勾选导出">先建表，再筛选并勾选导出</span>
		</div>
		<section class="filters">
			<div class="filter-tools">
				<span data-i18n="筛选条件（全部满足）">筛选条件（全部满足）</span><button id="addRule" data-i18n="添加条件">添加条件</button
				><label><input id="caseSensitive" type="checkbox" /><span data-i18n="区分大小写">区分大小写</span></label
				><button id="apply" data-i18n="应用筛选">应用筛选</button><button id="reset" data-i18n="重置筛选">重置筛选</button>
			</div>
			<div id="rules"></div>
			<p id="filterError" role="alert"></p>
		</section>
		<div class="selection-tools">
			<button id="selectFiltered" data-i18n="勾选全部筛选结果">勾选全部筛选结果</button
			><button id="clearSelection" data-i18n="取消全部勾选">取消全部勾选</button
			><span class="hint" data-i18n="导出仅包含当前筛选结果中的已勾选项">导出仅包含当前筛选结果中的已勾选项</span>
		</div>
		<div class="table-wrap">
			<table aria-label="器件清单">
				<thead id="head"></thead>
				<tbody id="rows"></tbody>
			</table>
		</div>
		<div class="pager">
			<p id="summary"></p>
			<button id="previous" data-i18n="上一页">上一页</button><span id="page"></span><button id="next" data-i18n="下一页">下一页</button>
		</div>
		<footer>
			<progress id="progress" hidden></progress>
			<div class="footer-row">
				<p id="messageBar" role="status"></p>
				<button id="export" class="primary" disabled data-i18n="导出勾选项">导出勾选项</button>
			</div>
		</footer>
		<script src="/iframe/js/device-list-ui.js"></script>
	</body>
</html>
